name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Backend – Python lint + test
  # ============================================================
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: meetmind_test
          POSTGRES_USER: meetmind
          POSTGRES_PASSWORD: meetmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meetmind -d meetmind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/api/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install .[dev]

      - name: Lint (ruff check)
        run: .venv/bin/ruff check .

      - name: Format check (ruff format)
        run: .venv/bin/ruff format --check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://meetmind:meetmind@localhost:5432/meetmind_test
          REDIS_URL: redis://localhost:6379/1
          S3_ENDPOINT_URL: ""
          S3_BUCKET_NAME: meetmind-test
          S3_ACCESS_KEY_ID: test
          S3_SECRET_ACCESS_KEY: test
          ASR_PROVIDER: disabled
          LLM_PROVIDER: disabled
          EMBEDDING_PROVIDER: local
          QA_ANSWER_PROVIDER: extractive
        run: .venv/bin/pytest tests/ -v --tb=short

  # ============================================================
  # Frontend – TypeScript + ESLint + Vitest + Build
  # ============================================================
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Vitest
        run: pnpm test

      - name: Build verification
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: pnpm build
